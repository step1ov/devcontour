name: Verify DevContour
on:
  pull_request:
  push:
    branches: [main, master]
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Проверки исполняются в песочнице ОС (sandbox-runtime): на Linux ей
      # нужны bubblewrap, socat и ripgrep, а Ubuntu 24.04 по умолчанию
      # отнимает у непривилегированных user namespaces нужные права.
      - name: Install the check sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npx playwright install --with-deps chromium
      - name: Verify and retain the complete log
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee verification.log
      - run: npm run format:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            verification.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
